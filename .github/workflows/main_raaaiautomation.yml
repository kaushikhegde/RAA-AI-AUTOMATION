# Build and deploy the RAA Travel Solution Guide to Azure App Service (Linux, Node).
#
# The app is a static Vite build served by server.js, which has no npm dependencies.
# Only dist/, server.js and package.json are deployed — not node_modules, not src/,
# and not the source PDFs/DOCX committed to this repo.

name: Build and deploy Node.js app to Azure Web App - raaaiautomation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Match the App Service runtime. App Service offers Node 20 and 22 LTS.
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assemble deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/dist
          cp server.js package.json deploy/
          echo "--- deployment package ---"
          find deploy -type f | sort
          du -sh deploy

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_45EBFF489765484EBA270075E2E45E8B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_30C85A31DA9C4D8BAA85AC3D15498B26 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AC92AD9E6E834EDBAF057EA7E1F60170 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'raaaiautomation'
          slot-name: 'Production'
          package: .
